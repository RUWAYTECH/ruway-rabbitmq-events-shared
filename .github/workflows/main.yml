name: Build & Publish NuGet

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH_COMMAND: Ruway.Events.Command/Ruway.Events.Command.csproj
  PROJECT_PATH_INTERFACES: Ruway.Events.Command.Interfaces/Ruway.Events.Command.Interfaces.csproj
  NUGET_OUTPUT: ./nupkgs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      # Determinar versión: usar tag si existe, sino 0.0.0-ci.{run}
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-ci.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Package version: $VERSION"

      - name: Pack
        run: |
          dotnet pack ${{ env.PROJECT_PATH_COMMAND }} \
            --configuration Release \
            --output ${{ env.NUGET_OUTPUT }} \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }}

          dotnet pack ${{ env.PROJECT_PATH_INTERFACES }} \
            --configuration Release \
            --output ${{ env.NUGET_OUTPUT }} \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write

    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
