name: CI/CD Pipeline - Ruway RabbitMQ Events Shared

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'ruway-rabbitmq-events-shared.sln'
  
jobs:
  clone-repository:
    name: Clone Repository
    runs-on: [self-hosted, Windows, X64, rokys-runner]
    
    steps:      
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        clean: false
        
    - name: Display repository information
      run: |
        Write-Host "============================================"
        Write-Host "Repository Information" -ForegroundColor Cyan
        Write-Host "============================================"
        Write-Host "Repository: ruway-rabbitmq-events-shared"
        Write-Host "Branch: ${{ github.ref_name }}"
        Write-Host "Workspace: ${{ github.workspace }}"
        Write-Host "Commit: ${{ github.sha }}"
        Write-Host "============================================"
      shell: powershell
        
    - name: Verify repository structure
      run: |
        Write-Host "Repository contents:" -ForegroundColor Cyan
        Get-ChildItem | ForEach-Object {
          Write-Host "  - $($_.Name)" -ForegroundColor White
        }
        Write-Host "============================================"
        Write-Host "Clone completed successfully" -ForegroundColor Green
        Write-Host "============================================"
      shell: powershell

